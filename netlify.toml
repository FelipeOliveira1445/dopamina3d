[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # CSP em modo Report-Only nesta entrega: registra violações sem bloquear recursos
    # até validarmos todos os fluxos, especialmente scripts inline e integrações externas.
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://crwhzjxybswjpkmnpzfd.supabase.co wss://crwhzjxybswjpkmnpzfd.supabase.co https://viacep.com.br; upgrade-insecure-requests"

[[headers]]
  for = "/portal-config.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/supabase/functions/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"


# PWA: o navegador deve verificar sempre a versão atual do manifesto e do Service Worker.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/portal"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/portal.js"
  [headers.values]
    Cache-Control = "no-cache"

# Não publicar SQL, funções nem leia-mes (podem conter dados e detalhes internos)
[[redirects]]
  from = "/*.sql"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/LEIA-ME*"
  to = "/404.html"
  status = 404
  force = true
