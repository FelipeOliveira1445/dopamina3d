<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#14110f"><title>Cadastro de cliente | Dopamina 3D</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#f4f1ea;--fg:#14110f;--mut:#716b63;--card:#fffdf8;--line:rgba(20,17,15,.12);--lime:#c6f432;--pink:#ff3d8b;--red:#bd3434;--green:#16834a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:Poppins,Arial,sans-serif;padding:28px 16px}.wrap{width:min(760px,100%);margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 18px 60px #14110f12}.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:22px}.mark{width:36px;height:36px;border:5px solid var(--fg);border-right-color:transparent;position:relative}.mark:after{content:"";position:absolute;width:9px;height:9px;background:var(--pink);right:-7px;top:2px}.brand b{background:var(--lime);padding:0 5px;border-radius:4px}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-top:25px}h1{font-size:27px;margin:8px 0}p{font-size:13px;line-height:1.7;color:var(--mut)}.section{border-top:1px solid var(--line);padding-top:20px;margin-top:22px}.section h2{font-size:16px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--mut)}input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;color:var(--fg);font:inherit;font-size:13px}input:focus{outline:3px solid #ff3d8b44;border-color:var(--pink)}.btn{width:100%;border:0;background:var(--lime);color:var(--fg);border-radius:999px;padding:14px 20px;font:600 13px Poppins,Arial,sans-serif;cursor:pointer;margin-top:20px}.btn:disabled{opacity:.55;cursor:wait}.hint{background:#f4f1ea;border-radius:12px;padding:12px 14px;margin:16px 0;font-size:11px;line-height:1.7;color:var(--mut)}.message{font-size:12px;min-height:18px;margin-top:14px}.error{color:var(--red)}.success{color:var(--green)}.check{display:flex;gap:9px;align-items:flex-start;font-size:11px;color:var(--mut);line-height:1.6;margin-top:15px}.check input{width:auto;margin-top:3px}.footer{text-align:center;border-top:1px solid var(--line);padding-top:16px;margin-top:22px;color:var(--mut);font-size:10px}.link{color:var(--fg);font-size:12px}@media(max-width:560px){.card{padding:22px 17px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}h1{font-size:23px}}
</style><meta name="color-scheme" content="light dark"><script>(function(){try{var v=localStorage.getItem('dopamina3d-theme');var d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',v==='light'||v==='dark'?v:(d?'dark':'light'));}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script><link rel="stylesheet" href="theme-global.css"><meta name="referrer" content="no-referrer"><link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Dopamina 3D"><link rel="apple-touch-icon" href="/assets/icon-192.png">
</head><body><button type="button" class="theme-toggle-global" data-theme-toggle aria-label="Alternar tema" title="Alternar tema" aria-pressed="false"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.6 8.6 0 1 0 20.5 14.2Z"></path></svg></button><main class="wrap"><section class="card"><div class="brand"><span class="mark"></span> dopamina<b>3d</b></div><div class="eyebrow">Cadastro · Pessoa física</div><h1>Crie sua conta</h1><p>Cadastre-se para facilitar seus pedidos e acompanhar seu relacionamento com a Dopamina 3D.</p><form id="customerForm">
<div class="section"><h2>Seus dados</h2><div class="grid"><div class="field full"><label for="full_name">Nome completo *</label><input id="full_name" autocomplete="name" maxlength="120" required></div><div class="field"><label for="email">E-mail *</label><input id="email" type="email" autocomplete="email" maxlength="254" required></div><div class="field"><label for="phone">Telefone / WhatsApp *</label><input id="phone" autocomplete="tel" inputmode="tel" placeholder="(62) 99999-9999" required></div><div class="field"><label for="document_number">CPF (opcional)</label><input id="document_number" inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></div></div></div>
<div class="section"><h2>Endereço de entrega</h2><div class="grid"><div class="field"><label for="postal_code">CEP *</label><input id="postal_code" inputmode="numeric" maxlength="9" placeholder="00000-000" required></div><div class="field"><label for="address_number">Número *</label><input id="address_number" maxlength="30" required></div><div class="field full"><label for="street">Logradouro *</label><input id="street" maxlength="180" required></div><div class="field"><label for="complement">Complemento</label><input id="complement" maxlength="100"></div><div class="field"><label for="neighborhood">Bairro *</label><input id="neighborhood" maxlength="100" required></div><div class="field"><label for="city">Cidade *</label><input id="city" maxlength="100" required></div><div class="field"><label for="state">UF *</label><input id="state" maxlength="2" placeholder="GO" required></div><div class="field full"><label for="reference">Referência</label><input id="reference" maxlength="180" placeholder="Ponto de referência"></div></div></div>
<div class="section"><h2>Acesso à conta</h2><div class="grid"><div class="field"><label for="password">Senha (mínimo 10 caracteres) *</label><input id="password" type="password" minlength="10" autocomplete="new-password" required></div><div class="field"><label for="confirmation">Confirme a senha *</label><input id="confirmation" type="password" minlength="10" autocomplete="new-password" required></div></div></div>
<label class="check"><input id="privacy" type="checkbox" required><span>Concordo com o uso dos dados informados para criação da conta, comunicação, atendimento e processamento dos meus pedidos. Confirmo que os dados são verdadeiros e que posso solicitar correção cadastral à Dopamina 3D.</span></label>
<button class="btn" id="submitButton" type="submit">Criar minha conta</button></form><p id="message" class="message" role="status" aria-live="polite"></p><p><a class="link" href="portal.html">Já tenho uma conta — entrar</a></p><div class="footer">Dopamina 3D · Uma dose por camada, um vício por peça.</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal-config.js"></script><script src="cadastro-cliente.js"></script><script src="theme-global.js"></script><script src="/pwa-install.js" defer></script>
</body></html>
